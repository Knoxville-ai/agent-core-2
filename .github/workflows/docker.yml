# Build and publish the agent-core Docker image to GHCR.
#
# Triggers:
#   - push of a v* tag (release)  → tags :vX.Y.Z + :latest
#   - push to the active default branch → tags :edge
#   - manual run via workflow_dispatch
#
# Consumers: SME repos (knoxville-ai/sme-odoo, etc.) use this image as
# a base via `FROM ghcr.io/knoxville-ai/agent-core:<tag>`. Pinning to a
# specific :vX.Y.Z is recommended for production SMEs; :latest is fine
# for dev.
name: docker

on:
  push:
    branches:
      - claude/build-ap-invoice-agent-k8EGw
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/knoxville-ai/agent-core
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,suffix=-edge
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # linux/amd64 only for now — Railway's build fleet is amd64.
          # arm64 adds ~6 minutes of build time for no current consumer.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
